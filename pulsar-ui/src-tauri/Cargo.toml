[package]
name = "pulsar-ui"
version.workspace = true
description = "Pulsar VPN desktop client (Tauri + Vue)"
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pulsar_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "image-ico", "image-png"] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-store = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1", features = ["full"] }
tonic = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.21"
pulsar-shared = { path = "../../pulsar-shared" }
pulsar-daemon = { path = "../../pulsar-daemon" }
tauri-plugin-autostart = "2.0.0"
url = "2.5.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
time = { version = "0.3", features = ["formatting"] }
tracing-appender = "0.2"
uuid = { version = "1.0", features = ["v4"] }
tauri-plugin-notification = "2.0"

# На Windows десктопный билд не использует pulsar-daemon как библиотеку —
# но компилировать его всё равно придётся (workspace dep). На Android —
# наоборот, только in-process. Можно потом закрыть feature-флагом, если
# раздует бинарь.

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
jni = "0.21"
ndk-context = "0.1"
libc = "0.2"

